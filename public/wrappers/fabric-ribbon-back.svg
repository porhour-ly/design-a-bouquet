<svg xmlns="http://www.w3.org/2000/svg" width="340" height="560" viewBox="0 0 340 560">
  <defs>
    <linearGradient id="frb-bg" x1="0.52" y1="0" x2="0.48" y2="1">
      <stop offset="0%" stop-color="rgb(245, 240, 232)" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="rgb(238, 230, 218)" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="frb-linen" patternUnits="userSpaceOnUse" width="3" height="3">
      <rect width="3" height="3" fill="transparent"/>
      <rect x="0" y="2" width="3" height="1" fill="rgba(200, 180, 150, 0.04)"/>
      <rect x="2" y="0" width="1" height="3" fill="rgba(200, 180, 150, 0.04)"/>
    </pattern>
  </defs>
  <!-- Composition zone background — linen texture (behind flowers) -->
  <rect x="1" y="1" width="338" height="418"
    rx="36" ry="36"
    fill="url(#frb-bg)"
    stroke="rgba(180, 160, 130, 0.2)"
    stroke-width="2"
    stroke-dasharray="8 5"
  />
  <!-- Linen weave overlay -->
  <rect x="1" y="1" width="338" height="418"
    rx="36" ry="36"
    fill="url(#frb-linen)"
  />
</svg>
