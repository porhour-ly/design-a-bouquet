<svg xmlns="http://www.w3.org/2000/svg" width="340" height="560" viewBox="0 0 340 560">
  <defs>
    <linearGradient id="frf-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a0b0"/>
      <stop offset="40%" stop-color="#c8889c"/>
      <stop offset="60%" stop-color="#b87088"/>
      <stop offset="100%" stop-color="#c8889c"/>
    </linearGradient>
    <linearGradient id="frf-fabric" x1="0.9" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#e8ddd0"/>
      <stop offset="40%" stop-color="#ddd0c0"/>
      <stop offset="100%" stop-color="#d0c0ae"/>
    </linearGradient>
    <clipPath id="frf-trap">
      <!-- Fabric handle trapezoid: 5% 0%, 95% 0%, 80% 100%, 20% 100% at y=420..560 -->
      <polygon points="17,420 323,420 272,560 68,560"/>
    </clipPath>
    <pattern id="frf-linen" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="transparent"/>
      <rect x="0" y="3" width="4" height="1" fill="rgba(180, 160, 130, 0.05)"/>
      <rect x="3" y="0" width="1" height="4" fill="rgba(180, 160, 130, 0.05)"/>
    </pattern>
  </defs>

  <!-- Satin ribbon divider (in front of flowers) -->
  <rect x="34" y="410" width="272" height="20" rx="10"
    fill="url(#frf-ribbon)"
  />
  <!-- Ribbon shine highlight -->
  <rect x="68" y="412" width="204" height="4" rx="2"
    fill="rgba(255,255,255,0.35)"
  />
  <!-- Bow center -->
  <text x="170" y="420" font-size="18" text-anchor="middle" dominant-baseline="central">🎀</text>

  <!-- Fabric handle wrap (in front of flowers) -->
  <g clip-path="url(#frf-trap)">
    <rect y="420" width="340" height="140" fill="url(#frf-fabric)"/>
    <rect y="420" width="340" height="140" fill="url(#frf-linen)"/>
  </g>
</svg>
