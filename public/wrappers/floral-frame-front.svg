<svg xmlns="http://www.w3.org/2000/svg" width="320" height="520" viewBox="0 0 320 520">
  <!-- Outer decorative border -->
  <rect x="1.5" y="1.5" width="317" height="517" rx="20" ry="20"
    fill="none"
    stroke="rgba(120, 160, 100, 0.4)"
    stroke-width="3"
  />
  <!-- Inner white inset ring -->
  <rect x="5.5" y="5.5" width="309" height="509" rx="17" ry="17"
    fill="none"
    stroke="rgba(255,255,255,0.5)"
    stroke-width="4"
  />
  <!-- Second green inset ring -->
  <rect x="9.5" y="9.5" width="301" height="501" rx="14" ry="14"
    fill="none"
    stroke="rgba(120, 160, 100, 0.15)"
    stroke-width="4"
  />
  <!-- Inner composition area dashed hint -->
  <rect x="24" y="24" width="272" height="472" rx="12" ry="12"
    fill="none"
    stroke="rgba(120, 160, 100, 0.2)"
    stroke-width="1.5"
    stroke-dasharray="6 4"
  />
  <!-- Corner leaf accents -->
  <text x="16" y="26" font-size="16" opacity="0.6">🌿</text>
  <text x="290" y="26" font-size="16" opacity="0.6" transform="rotate(90, 298, 18)">🌿</text>
  <text x="290" y="510" font-size="16" opacity="0.6" transform="rotate(180, 298, 502)">🌿</text>
  <text x="16" y="510" font-size="16" opacity="0.6" transform="rotate(270, 24, 502)">🌿</text>
</svg>
